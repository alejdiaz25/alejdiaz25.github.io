<script>
'use strict';

/* ── CONTENT RENDERER — fetches content.json, populates all sections ── */
(function () {
  Promise.all([
    fetch('content.json').then(r => r.json()),
    fetch('projects.json').then(r => r.json()),
  ])
    .then(([C, P]) => renderAll(C, P))
    .catch(e => console.error('Failed to load data:', e));

  function esc(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  /* ── ICONS (Geist-style stroke icons, inlined — no build step) ── */
  var ICON = {
    chevronLeft:  '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>',
    chevronRight: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
    arrowRight:   '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
    arrowUpRight: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"/></svg>',
  };

  function renderAll(C, P) {
    renderAbout(C.about);
    renderProjectsPreview(P.preview);
    renderExperience(C.experience);
    renderCoursework(C.coursework);
    renderSkills(C.skills);
    renderContact(C.contact);
    renderFooter(C.footer);

    /* Re-init scroll animations and scramble after DOM is populated */
    if (window.initAnimations) window.initAnimations();

    /* Scroll to hash target after dynamic content is rendered
       (fixes cross-page nav from projects.html → index.html#section) */
    if (location.hash) {
      var target = document.querySelector(location.hash);
      if (target) target.scrollIntoView();
    }
  }

  /* ── ABOUT ──────────────────────────────────────────────── */
  function renderAbout(d) {
    const el = document.getElementById('about-content');
    const statsHtml = d.stats.map(s =>
      `<div class="stat-cell"><div class="stat-num">${esc(s.num)}</div><div class="stat-label">${esc(s.label)}</div></div>`
    ).join('');
    const parasHtml = d.paragraphs.map(p => `<p>${p}</p>`).join('');

    let mediaHtml = '';
    if (d.photos && d.photos.length > 0) {
      const total = d.photos.length;
      const slidesHtml = d.photos.map((ph, i) =>
        `<div class="ac-slide${i === 0 ? ' active' : ''}"><img src="${esc(ph.src)}" alt="${esc(ph.alt)}" loading="lazy" /></div>`
      ).join('');
      const dotsHtml = d.photos.map((_, i) =>
        `<span class="ac-dot${i === 0 ? ' active' : ''}"></span>`
      ).join('');
      mediaHtml = `
        <div class="about-carousel enter-fade" style="transition-delay:80ms">
          <div class="ac-stage">
            <button class="ac-side-btn ac-prev" aria-label="Previous">${ICON.chevronLeft}</button>
            <div class="ac-media">
              <div class="ac-wrap">
                <div class="ac-bracket tl"></div>
                <div class="ac-bracket tr"></div>
                <div class="ac-bracket bl"></div>
                <div class="ac-bracket br"></div>
                ${slidesHtml}
              </div>
              <div class="ac-controls">
                <div class="ac-dots">${dotsHtml}</div>
              </div>
            </div>
            <button class="ac-side-btn ac-next" aria-label="Next">${ICON.chevronRight}</button>
          </div>
        </div>`;
    } else if (d.headshot) {
      const hs = d.headshot;
      mediaHtml = `<div class="about-headshot enter-fade" style="transition-delay:80ms">
           <img src="${esc(hs.src)}" alt="${esc(hs.alt)}" width="${hs.width}" height="${hs.height}" loading="lazy" />
         </div>`;
    }

    el.innerHTML = `
      <div class="about-left">
        <p class="section-eyebrow enter-fade" style="transition-delay:0ms">${esc(d.eyebrow)}</p>
        <div class="rule"></div>
        <h2 class="section-title enter-fade" style="transition-delay:160ms">${d.title}</h2>
        <div class="stat-grid enter-stagger">${statsHtml}</div>
        ${mediaHtml}
      </div>
      <div class="about-body enter-fade">
        ${parasHtml}
      </div>`;

    if (d.photos && d.photos.length > 0) {
      initAboutCarousel(d.photos.length);
    }
  }

  function initAboutCarousel(total) {
    const wrap = document.querySelector('.about-carousel');
    if (!wrap) return;
    const slides = wrap.querySelectorAll('.ac-slide');
    const dots   = wrap.querySelectorAll('.ac-dot');
    const prevBtn = wrap.querySelector('.ac-prev');
    const nextBtn = wrap.querySelector('.ac-next');
    let current = 0;
    let autoTimer = null;

    function goTo(index) {
      index = ((index % total) + total) % total;
      slides[current].classList.remove('active');
      dots[current].classList.remove('active');
      current = index;
      slides[current].classList.add('active');
      dots[current].classList.add('active');
    }

    function startAuto() {
      clearInterval(autoTimer);
      autoTimer = setInterval(() => goTo(current + 1), 4000);
    }

    prevBtn.addEventListener('click', () => { goTo(current - 1); startAuto(); });
    nextBtn.addEventListener('click', () => { goTo(current + 1); startAuto(); });
    dots.forEach((dot, i) => dot.addEventListener('click', () => { goTo(i); startAuto(); }));
    wrap.addEventListener('mouseenter', () => clearInterval(autoTimer));
    wrap.addEventListener('mouseleave', startAuto);

    /* Swipe support */
    const acWrap = wrap.querySelector('.ac-wrap');
    let touchStartX = 0;
    acWrap.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
    acWrap.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(dx) > 40) { goTo(dx < 0 ? current + 1 : current - 1); startAuto(); }
    }, { passive: true });

    startAuto();
  }

  /* ── EXPERIENCE ─────────────────────────────────────────── */
  function renderExperience(d) {
    const el = document.getElementById('experience-content');
    function buildItems(items) {
      return items.map(item => {
        const bullets = item.bullets.map(b => `<li>${b}</li>`).join('');
        const logoHtml = item.logo ? `<img class="exp-logo" src="${esc(item.logo)}" alt="${esc(item.company)} logo" loading="lazy" />` : '';
        return `<div class="exp-item enter-line">
          <div class="exp-left">
            <div class="exp-company">${esc(item.company)}</div>
            <div class="exp-period">${esc(item.period)}</div>
            ${logoHtml}
          </div>
          <div>
            <div class="exp-role">${item.role}</div>
            <ul class="exp-bullets">${bullets}</ul>
          </div>
        </div>`;
      }).join('');
    }
    const relevantHtml = d.relevantItems ? `
      <h2 class="section-title enter-fade" style="margin-top:4rem;transition-delay:160ms">${esc(d.relevantTitle)}</h2>
      <div class="exp-list">${buildItems(d.relevantItems)}</div>` : '';
    el.innerHTML = `
      <p class="section-eyebrow enter-fade" style="transition-delay:0ms">${esc(d.eyebrow)}</p>
      <div class="rule"></div>
      <h2 class="section-title enter-fade" style="transition-delay:160ms">${esc(d.title)}</h2>
      <div class="exp-list">${buildItems(d.items)}</div>
      ${relevantHtml}`;
  }

  /* ── PROJECTS PREVIEW ───────────────────────────────────── */
  function renderProjectsPreview(d) {
    var el = document.getElementById('projects-preview-content');
    var thumbsHtml = d.thumbs.map(function(t) {
      return '<a href="projects.html?project=' + esc(t.id) + '" class="carousel-card" data-project="' + esc(t.id) + '">' +
        '<div class="carousel-card-image">' +
          '<img src="' + esc(t.img) + '" alt="' + esc(t.alt) + '" width="' + t.width + '" height="' + t.height + '" loading="lazy" />' +
        '</div>' +
        '<div class="carousel-card-text">' +
          '<div class="carousel-card-label">' + esc(t.label) + '</div>' +
        '</div>' +
      '</a>';
    }).join('');
    el.innerHTML =
      '<p class="section-eyebrow enter-fade" style="transition-delay:0ms">' + esc(d.eyebrow) + '</p>' +
      '<div class="rule"></div>' +
      '<h2 class="section-title enter-fade" style="transition-delay:160ms">' + esc(d.title) + '</h2>' +
      '<div class="carousel" id="projects-carousel">' +
        '<div class="carousel-track" id="carousel-track">' + thumbsHtml + '</div>' +
      '</div>' +
      '<div class="carousel-controls">' +
        '<div class="carousel-progress">' +
          '<div class="carousel-progress-thumb" id="carousel-thumb"></div>' +
        '</div>' +
        '<div class="carousel-arrows">' +
          '<button class="carousel-arrow" id="carousel-prev" aria-label="Previous">' +
            '<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2L4 7L9 12"/></svg>' +
          '</button>' +
          '<button class="carousel-arrow" id="carousel-next" aria-label="Next">' +
            '<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2L10 7L5 12"/></svg>' +
          '</button>' +
        '</div>' +
      '</div>' +
      '<div class="carousel-view-all">' +
        '<a href="' + esc(d.link.href) + '">' + esc(d.link.text) + ICON.arrowUpRight + '</a>' +
      '</div>';
    initProjectsCarousel();
  }

  function initProjectsCarousel() {
    var track = document.getElementById('carousel-track');
    var carousel = document.getElementById('projects-carousel');
    var thumb = document.getElementById('carousel-thumb');
    var prevBtn = document.getElementById('carousel-prev');
    var nextBtn = document.getElementById('carousel-next');
    if (!track || !carousel) return;
    var cards = track.querySelectorAll('.carousel-card');
    var total = cards.length;
    if (total === 0) return;
    var current = 0;
    var paused = false;
    var timer = null;
    var isDragging = false;
    var startX = 0;
    var dragOffset = 0;

    function cardW() { return cards[0] ? cards[0].offsetWidth : 300; }
    function gapPx() { return parseInt(getComputedStyle(track).gap) || 20; }
    function stepPx() { return cardW() + gapPx(); }
    function vis() {
      var cw = cardW();
      return cw > 0 ? Math.max(1, Math.floor(carousel.offsetWidth / (cw + gapPx()))) : 1;
    }
    function maxIdx() { return Math.max(0, total - vis()); }

    function goTo(idx, anim) {
      var mx = maxIdx();
      if (idx > mx) idx = 0;
      if (idx < 0) idx = mx;
      current = idx;
      if (anim === false) track.classList.add('no-anim');
      else track.classList.remove('no-anim');
      track.style.transform = 'translateX(' + (-current * stepPx()) + 'px)';
      if (anim === false) {
        void track.offsetHeight;
        track.classList.remove('no-anim');
      }
      updateThumb();
    }

    function updateThumb() {
      if (!thumb) return;
      var v = vis();
      thumb.style.width = (v / total) * 100 + '%';
      thumb.style.left = (maxIdx() > 0 ? (current / total) * 100 : 0) + '%';
    }

    /* Auto-advance */
    function startTimer() {
      stopTimer();
      timer = setInterval(function() {
        if (!paused) goTo(current + 1, true);
      }, 4000);
    }
    function stopTimer() {
      if (timer) { clearInterval(timer); timer = null; }
    }

    carousel.addEventListener('mouseenter', function() { paused = true; });
    carousel.addEventListener('mouseleave', function() { paused = false; });

    /* Arrow buttons */
    if (prevBtn) prevBtn.addEventListener('click', function() { goTo(current - 1, true); startTimer(); });
    if (nextBtn) nextBtn.addEventListener('click', function() { goTo(current + 1, true); startTimer(); });

    /* Drag to scroll */
    function pointerDown(e) {
      isDragging = true;
      startX = e.clientX || (e.touches ? e.touches[0].clientX : 0);
      dragOffset = 0;
      track.classList.add('no-anim');
      carousel.classList.add('is-dragging');
      stopTimer();
    }
    function pointerMove(e) {
      if (!isDragging) return;
      var clientX = e.clientX || (e.touches ? e.touches[0].clientX : 0);
      dragOffset = clientX - startX;
      track.style.transform = 'translateX(' + (-current * stepPx() + dragOffset) + 'px)';
    }
    function pointerUp() {
      if (!isDragging) return;
      isDragging = false;
      carousel.classList.remove('is-dragging');
      track.classList.remove('no-anim');
      var threshold = cardW() * 0.15;
      if (dragOffset < -threshold) {
        goTo(current + 1, true);
      } else if (dragOffset > threshold) {
        goTo(current - 1, true);
      } else {
        goTo(current, true);
      }
      dragOffset = 0;
      startTimer();
    }

    carousel.addEventListener('mousedown', pointerDown);
    window.addEventListener('mousemove', pointerMove);
    window.addEventListener('mouseup', pointerUp);
    carousel.addEventListener('touchstart', pointerDown, { passive: true });
    window.addEventListener('touchmove', pointerMove, { passive: true });
    window.addEventListener('touchend', pointerUp);

    /* Prevent link navigation during drag */
    track.addEventListener('click', function(e) {
      if (Math.abs(dragOffset) > 5) e.preventDefault();
    }, true);

    /* Keyboard */
    carousel.setAttribute('tabindex', '0');
    carousel.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(current - 1, true); startTimer(); }
      if (e.key === 'ArrowRight') { e.preventDefault(); goTo(current + 1, true); startTimer(); }
    });

    /* Resize */
    var resizeTimer;
    window.addEventListener('resize', function() {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function() { goTo(current, false); }, 100);
    });

    /* Init */
    updateThumb();
    startTimer();
  }

  /* ── COURSEWORK ─────────────────────────────────────────── */
  function renderCoursework(d) {
    const el = document.getElementById('coursework-content');
    const coursesHtml = d.courses.map(c =>
      `<div class="course-row"><div class="course-code">${esc(c.code)}</div><div class="course-name">${esc(c.name)}</div></div>`
    ).join('');
    const projsHtml = d.academicProjects.map(p => {
      const tagsHtml = (p.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('');
      const wipHtml = p.wip ? '<span class="cw-wip">In Progress</span>' : '';
      const tagsBlock = tagsHtml ? `<div class="project-tags" style="padding:0.75rem 0 0;">${tagsHtml}</div>` : '';
      return `<div class="cw-card enter-line">
        <div class="cw-label">${esc(p.label)}</div>
        <div class="cw-name">${esc(p.name)}</div>
        <div class="cw-desc">${esc(p.desc)}</div>
        ${tagsBlock}${wipHtml}
      </div>`;
    }).join('');
    el.innerHTML = `
      <p class="section-eyebrow enter-fade" style="transition-delay:0ms">${esc(d.eyebrow)}</p>
      <div class="rule"></div>
      <h2 class="section-title enter-fade" style="transition-delay:160ms">${esc(d.title)}</h2>
      <div class="cw-grid">
        <div>
          <p style="font-family:var(--font-mono);font-size:0.725rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--text-muted);margin-bottom:1rem;">Relevant Courses</p>
          <div class="courses-table">${coursesHtml}</div>
        </div>
        <div>
          <p style="font-family:var(--font-mono);font-size:0.725rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--text-muted);margin-bottom:1rem;">Academic Projects</p>
          <div class="cw-projects">${projsHtml}</div>
        </div>
      </div>`;
  }

  /* ── SKILLS ─────────────────────────────────────────────── */
  function renderSkills(d) {
    const el = document.getElementById('skills-content');
    const groupsHtml = d.groups.map(g => {
      const tags = g.tags.map(t => `<span class="skill-tag">${esc(t)}</span>`).join('');
      return `<div>
        <div class="skill-group-label">${esc(g.label)}</div>
        <div class="skill-tags enter-stagger">${tags}</div>
      </div>`;
    }).join('');
    const subHtml = d.subtitle ? `<p class="skills-subtitle enter-fade" style="transition-delay:240ms">${esc(d.subtitle)}</p>` : '';
    el.innerHTML = `
      <p class="section-eyebrow enter-fade" style="transition-delay:0ms">${esc(d.eyebrow)}</p>
      <div class="rule"></div>
      <h2 class="section-title enter-fade" style="transition-delay:160ms">${esc(d.title)}</h2>
      ${subHtml}
      <div class="skills-grid">${groupsHtml}</div>`;
  }

  /* ── CONTACT ────────────────────────────────────────────── */
  function renderContact(d) {
    const el = document.getElementById('contact-content');
    const linksHtml = d.links.map(l => {
      if (l.static) {
        return `<div class="contact-link" style="cursor:default;">
          <div class="contact-link-inner">
            <div class="contact-link-label">${esc(l.label)}</div>
            <div class="contact-link-value">${esc(l.value)}</div>
          </div>
          <span class="contact-arrow" style="font-size:0.6rem;letter-spacing:0.1em;">${esc(l.arrow)}</span>
        </div>`;
      }
      const target = l.external ? ' target="_blank" rel="noopener noreferrer"' : '';
      return `<a href="${esc(l.href)}"${target} class="contact-link">
        <div class="contact-link-inner">
          <div class="contact-link-label">${esc(l.label)}</div>
          <div class="contact-link-value">${esc(l.value)}</div>
        </div>
        <span class="contact-arrow">${ICON.arrowRight}</span>
      </a>`;
    }).join('');
    el.innerHTML = `
      <div>
        <p class="section-eyebrow enter-fade" style="transition-delay:0ms">${esc(d.eyebrow)}</p>
        <div class="rule"></div>
        <h2 class="contact-heading">${d.heading}</h2>
        <p class="contact-sub">${esc(d.sub)}</p>
        <a href="${esc(d.resumeHref)}" class="btn-primary" target="_blank" rel="noopener noreferrer">View Resume${ICON.arrowUpRight}</a>
      </div>
      <div class="contact-links enter-stagger">${linksHtml}</div>`;
  }

  /* ── FOOTER ─────────────────────────────────────────────── */
  function renderFooter(d) {
    const el = document.getElementById('footer-content');
    el.innerHTML = `<p>${esc(d.copyright)}</p>`;
  }
})();
</script>
<script src="js/animations.js"></script>
<script src="js/nav.js"></script>
</body>
